  :root { --ink:#1b2733; --muted:#6b7785; --line:#dfe5ec; --accent:#0a64a4; --bg:#eef2f6; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;

  input[type=password] { width:100%; padding:12px 14px; font-size:15px; border:1px solid var(--line);
    border-radius:10px; outline:none; transition:border-color .15s; }
  input[type=password]:focus { border-color:var(--accent); }
  button { padding:12px 14px; font-size:15px; font-weight:600; color:#fff; background:var(--accent);
    border:none; border-radius:10px; cursor:pointer; transition:opacity .15s; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:#c0392b; font-size:13px; min-height:18px; margin-top:2px; }
  .foot { margin-top:18px; font-size:11px; color:var(--muted); }
